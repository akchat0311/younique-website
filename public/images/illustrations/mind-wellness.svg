<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="">
  <!-- Flat editorial illustration: seated figure in calm, concentric
       ripples and floating leaves — therapeutic & mind wellness. -->
  <rect width="800" height="450" fill="#effbfc"/>
  <ellipse cx="150" cy="100" rx="190" ry="120" fill="#d7f3f6"/>
  <ellipse cx="680" cy="360" rx="200" ry="140" fill="#d9eefa"/>
  <!-- concentric calm ripples -->
  <circle cx="400" cy="240" r="170" fill="#aee7ed" opacity="0.5"/>
  <circle cx="400" cy="240" r="130" fill="#7fd6e0" opacity="0.4"/>
  <circle cx="400" cy="240" r="92" fill="#52c0ce" opacity="0.35"/>
  <!-- meditating figure -->
  <g transform="translate(400 250)">
    <!-- crossed legs base -->
    <path d="M-64 60 Q 0 88 64 60 Q 40 84 0 84 Q -40 84 -64 60 Z" fill="#0e415f"/>
    <!-- body -->
    <path d="M-38 62 Q -44 -8 0 -14 Q 44 -8 38 62 Z" fill="#0f8acb"/>
    <!-- arms resting -->
    <path d="M-38 8 Q -62 30 -52 58 Q -30 66 -18 56" fill="#0a72b0"/>
    <path d="M38 8 Q 62 30 52 58 Q 30 66 18 56" fill="#0a72b0"/>
    <!-- head -->
    <circle cx="0" cy="-38" r="24" fill="#0e415f"/>
  </g>
  <!-- floating leaves -->
  <g fill="#45b87f">
    <path d="M170 210 q 22 -26 44 0 q -22 26 -44 0 Z"/>
    <path d="M600 150 q 20 -24 40 0 q -20 24 -40 0 Z" fill="#72d3a3"/>
    <path d="M630 260 q 16 -20 32 0 q -16 20 -32 0 Z"/>
    <path d="M200 330 q 16 -20 32 0 q -16 20 -32 0 Z" fill="#72d3a3"/>
  </g>
  <!-- small magenta spark accents -->
  <circle cx="252" cy="120" r="7" fill="#d22f95"/>
  <circle cx="566" cy="332" r="6" fill="#d22f95" opacity="0.7"/>
  <circle cx="540" cy="96" r="5" fill="#b08830" opacity="0.6"/>
</svg>
