<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="">
  <!-- Flat editorial illustration: a professional climbing steps toward a
       target — mid-career direction and growth. -->
  <rect width="800" height="450" fill="#eff8fd"/>
  <ellipse cx="130" cy="360" rx="200" ry="130" fill="#d9eefa"/>
  <ellipse cx="660" cy="100" rx="190" ry="120" fill="#d7f3f6"/>
  <!-- ascending steps -->
  <g fill="#abdbf4">
    <rect x="80" y="360" width="150" height="90" rx="8"/>
    <rect x="230" y="310" width="150" height="140" rx="8" fill="#74c3ea"/>
    <rect x="380" y="255" width="150" height="195" rx="8" fill="#38a6dc"/>
    <rect x="530" y="195" width="150" height="255" rx="8" fill="#0f8acb"/>
  </g>
  <!-- target at the top -->
  <g transform="translate(605 120)">
    <circle cx="0" cy="0" r="46" fill="#ffffff"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#0a72b0" stroke-width="10"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38a6dc" stroke-width="10"/>
    <circle cx="0" cy="0" r="8" fill="#d22f95"/>
  </g>
  <!-- rising dashed trajectory -->
  <path d="M150 340 C 260 300 340 260 430 230 C 500 207 540 180 572 152"
        fill="none" stroke="#d22f95" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- climbing figure on the second step -->
  <g transform="translate(300 240)">
    <circle cx="0" cy="-46" r="22" fill="#0e415f"/>
    <path d="M-26 -26 Q -32 44 -18 70 L 18 70 Q 32 44 26 -26 Q 0 -38 -26 -26 Z" fill="#0a72b0"/>
    <!-- reaching arm -->
    <path d="M20 -14 Q 52 -40 74 -50" fill="none" stroke="#0e415f" stroke-width="14" stroke-linecap="round"/>
    <!-- briefcase in other hand -->
    <rect x="-58" y="30" width="40" height="30" rx="6" fill="#71551e"/>
    <rect x="-44" y="22" width="12" height="10" rx="4" fill="none" stroke="#71551e" stroke-width="5"/>
  </g>
  <!-- sparks -->
  <path d="M460 130 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z" fill="#b08830" opacity="0.85"/>
  <circle cx="220 " cy="150" r="6" fill="#34a6b6"/>
</svg>
