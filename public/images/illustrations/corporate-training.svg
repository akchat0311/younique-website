<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="">
  <!-- Flat editorial illustration: facilitator presenting a chart to a
       small audience — workshop-format training. -->
  <rect width="800" height="450" fill="#eff8fd"/>
  <ellipse cx="140" cy="90" rx="190" ry="120" fill="#d9eefa"/>
  <ellipse cx="690" cy="380" rx="190" ry="130" fill="#d7f3f6"/>
  <!-- floor line -->
  <path d="M0 388 Q 400 356 800 388 L 800 450 L 0 450 Z" fill="#abdbf4"/>
  <!-- presentation board -->
  <g transform="translate(485 92)">
    <rect x="-20" y="-20" width="270" height="196" rx="16" fill="#0e415f"/>
    <rect x="-6" y="-6" width="242" height="168" rx="10" fill="#ffffff"/>
    <!-- bar chart on board -->
    <rect x="26" y="92" width="30" height="48" rx="5" fill="#74c3ea"/>
    <rect x="72" y="64" width="30" height="76" rx="5" fill="#38a6dc"/>
    <rect x="118" y="78" width="30" height="62" rx="5" fill="#52c0ce"/>
    <rect x="164" y="38" width="30" height="102" rx="5" fill="#0f8acb"/>
    <!-- rising line -->
    <path d="M30 80 L 84 52 L 130 62 L 176 26" fill="none" stroke="#d22f95" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="176" cy="26" r="8" fill="#d22f95"/>
    <!-- board stand -->
    <rect x="106" y="176" width="14" height="60" rx="6" fill="#0a4e73"/>
  </g>
  <!-- presenter -->
  <g transform="translate(400 262)">
    <circle cx="0" cy="-44" r="24" fill="#0e415f"/>
    <path d="M-28 -22 Q -36 76 -20 120 L 20 120 Q 36 76 28 -22 Q 0 -34 -28 -22 Z" fill="#0f8acb"/>
    <!-- pointing arm -->
    <path d="M22 -6 Q 62 -34 92 -52" fill="none" stroke="#0a72b0" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- audience: three seated figures -->
  <g transform="translate(120 330)">
    <g>
      <circle cx="0" cy="-36" r="20" fill="#0e415f"/>
      <path d="M-24 -16 Q -28 40 -18 62 L 18 62 Q 28 40 24 -16 Q 0 -28 -24 -16 Z" fill="#34a6b6"/>
    </g>
    <g transform="translate(96 14)">
      <circle cx="0" cy="-36" r="20" fill="#0e415f"/>
      <path d="M-24 -16 Q -28 40 -18 62 L 18 62 Q 28 40 24 -16 Q 0 -28 -24 -16 Z" fill="#0a72b0"/>
    </g>
    <g transform="translate(192 2)">
      <circle cx="0" cy="-36" r="20" fill="#0e415f"/>
      <path d="M-24 -16 Q -28 40 -18 62 L 18 62 Q 28 40 24 -16 Q 0 -28 -24 -16 Z" fill="#c8a24a"/>
    </g>
  </g>
  <!-- idea sparks above audience -->
  <circle cx="150" cy="220" r="6" fill="#b08830"/>
  <path d="M216 190 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z" fill="#d22f95" opacity="0.8"/>
</svg>
